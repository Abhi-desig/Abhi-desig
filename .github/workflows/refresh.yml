name: refresh profile

# Rebuilds the profile from the GitHub API and commits the result.
#
# Loop safety — two independent guards, because one alone is easy to break:
#   1. Commits pushed with GITHUB_TOKEN do not trigger workflow runs.
#   2. The `push` trigger below filters on source paths only, so the files this
#      job writes (README.md, assets/generated/**) are not among its triggers.
# Either one would prevent a self-retriggering loop; both means a future change
# to one doesn't quietly arm the other.

on:
  # Four times a day. The offset minute avoids the top-of-hour queue, where
  # scheduled jobs on shared runners are most likely to be delayed.
  schedule:
    - cron: '17 */6 * * *'

  # Manual run from the Actions tab.
  workflow_dispatch:

  # Trigger from anywhere:
  #   curl -X POST -H "Authorization: bearer $TOKEN" \
  #     -H "Accept: application/vnd.github+json" \
  #     https://api.github.com/repos/Abhi-desig/Abhi-desig/dispatches \
  #     -d '{"event_type":"refresh"}'
  repository_dispatch:
    types: [refresh]

  # Rebuild when the generator or the config changes — never on its own output.
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'assets/fonts/**'
      - 'profile.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/refresh.yml'

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # Runs before the build so the build's content-hash pass covers these
      # files too and they get cache-busted along with everything else.
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            assets/generated/github-snake.svg?palette=github-light
            assets/generated/github-snake-dark.svg?palette=github-dark

      - name: Build profile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: npm run build

      - name: Commit if changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A

          # Only commit on a real diff. Committing unconditionally would put a
          # green square on the contribution graph four times a day for doing
          # nothing, which would quietly inflate the very streak this page reports.
          if git diff --staged --quiet; then
            echo "No changes — nothing to commit."
            exit 0
          fi

          git commit -m "chore: refresh profile"
          git push
