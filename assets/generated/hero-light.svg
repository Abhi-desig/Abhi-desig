<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" fill="none" role="img" aria-label="Abhinav Anil — Creative Technologist">
<title>Abhinav Anil — Creative Technologist</title>
<desc>Motion, interfaces, and small tools that do one thing well.</desc>
<style>
  
    text{dominant-baseline:auto}
    @media (prefers-reduced-motion:reduce){
      *{animation:none!important;opacity:1!important;transform:none!important}
      .cnt{opacity:0!important}.cnt-last{opacity:1!important}
    }
  

  .gc{opacity:0;animation:gc 7s cubic-bezier(.4,0,.2,1) infinite;animation-delay:calc(var(--i)*28ms)}
  @keyframes gc{0%{opacity:0}6%,88%{opacity:1}97%,100%{opacity:0}}

  .rail{opacity:0;animation:fade 7s cubic-bezier(.22,1,.36,1) infinite}
  .rail-b{opacity:0;animation:fade 7s cubic-bezier(.22,1,.36,1) infinite;animation-delay:.12s}
  @keyframes fade{0%,2%{opacity:0}8%,90%{opacity:1}97%,100%{opacity:0}}

  .hr{transform:scaleX(0);transform-origin:64px 0;animation:hr 7s cubic-bezier(.22,1,.36,1) infinite}
  @keyframes hr{0%,3%{transform:scaleX(0)}12%,90%{transform:scaleX(1)}97%,100%{transform:scaleX(0)}}

  .l{opacity:0;animation:rise 7s cubic-bezier(.22,1,.36,1) infinite;animation-delay:calc(var(--i)*45ms)}
  @keyframes rise{
    0%,5.000%{opacity:0;transform:translateY(106px)}
    15.000%,87.143%{opacity:1;transform:translateY(0)}
    96.429%,100%{opacity:0;transform:translateY(-14px)}
  }

  .accent-rule{transform:scaleX(0);transform-origin:64px 0;animation:ar 7s cubic-bezier(.22,1,.36,1) infinite}
  @keyframes ar{
    0%,17.143%{transform:scaleX(0)}
    25.000%,88.571%{transform:scaleX(1)}
    97.143%,100%{transform:scaleX(0)}
  }

  /* Mask wipe via a clipPath rect scaled on the X axis. Scaling a clip rect is
     portable; animating its width attribute is not. */
  .roleWipe{transform:scaleX(0);transform-origin:64px 0;animation:rw 7s cubic-bezier(.22,1,.36,1) infinite}
  @keyframes rw{
    0%,20.000%{transform:scaleX(0)}
    28.571%,88.571%{transform:scaleX(1)}
    97.143%,100%{transform:scaleX(0)}
  }

  .tag{opacity:0;animation:tag 7s cubic-bezier(.22,1,.36,1) infinite}
  @keyframes tag{
    0%,24.286%{opacity:0;transform:translateY(9px)}
    32.143%,88.571%{opacity:1;transform:translateY(0)}
    97.143%,100%{opacity:0}
  }

  .cnt{opacity:0}
  .c0{animation:c0 7s linear infinite}
       @keyframes c0{
         0%,26.414%{opacity:0}
         26.429%,28.057%{opacity:1}
         28.071%,100%{opacity:0}
       }
.c1{animation:c1 7s linear infinite}
       @keyframes c1{
         0%,28.057%{opacity:0}
         28.071%,29.700%{opacity:1}
         29.714%,100%{opacity:0}
       }
.c2{animation:c2 7s linear infinite}
       @keyframes c2{
         0%,29.700%{opacity:0}
         29.714%,31.343%{opacity:1}
         31.357%,100%{opacity:0}
       }
.c3{animation:c3 7s linear infinite}
       @keyframes c3{
         0%,31.343%{opacity:0}
         31.357%,32.986%{opacity:1}
         33.000%,100%{opacity:0}
       }
.c4{animation:c4 7s linear infinite}
       @keyframes c4{
         0%,32.986%{opacity:0}
         33.000%,88.557%{opacity:1}
         88.571%,100%{opacity:0}
       }

  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s cubic-bezier(.4,0,.2,1) infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.38;transform:scale(.72)}}

  /* One slow sweep during the hold, so the frame never sits perfectly still. */
  .scan{opacity:0;animation:scan 7s linear infinite}
  @keyframes scan{
    0%,51.429%{opacity:0;transform:translateX(-140px)}
    56.429%{opacity:1}
    78.571%,100%{opacity:0;transform:translateX(1420px)}
  }</style>
