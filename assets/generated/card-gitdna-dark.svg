  <text x="398" y="54" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="500" letter-spacing="1.4" fill="#8A8A8A" fill-opacity="1" text-anchor="end" xml:space="preserve">PYTHON</text>
</g>

<text style="--i:0" x="36" y="92" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" letter-spacing="0.1" fill="#8A8A8A" fill-opacity="1" text-anchor="start" class="cb" xml:space="preserve">Reads a repository&apos;s commit history and renders its</text><text style="--i:1" x="36" y="109" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" letter-spacing="0.1" fill="#8A8A8A" fill-opacity="1" text-anchor="start" class="cb" xml:space="preserve">shape — who touched what, and when.</text>


