11.39L114.85-18.90L119.41-18.90L111.53-9.58L119.68 0L114.99 0L108.72-7.67L108.24-7.67" class="cl" style="--i:7" fill="#0A0A0A" /></g>

<g class="frame">
  <circle cx="311.0" cy="50" r="4" fill="#3178c6" class="dot" />
  <text x="398" y="54" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="500" letter-spacing="1.4" fill="#5F5F5F" fill-opacity="1" text-anchor="end" xml:space="preserve">TYPESCRIPT</text>
