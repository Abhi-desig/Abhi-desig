<text style="--i:0" x="36" y="92" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" letter-spacing="0.1" fill="#5F5F5F" fill-opacity="1" text-anchor="start" class="cb" xml:space="preserve">Your life as a deck of day cards. Local-first,</text><text style="--i:1" x="36" y="109" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" letter-spacing="0.1" fill="#5F5F5F" fill-opacity="1" text-anchor="start" class="cb" xml:space="preserve">offline, and SQLite all the way down.</text>


