<svg xmlns="http://www.w3.org/2000/svg" width="420" height="168" viewBox="0 0 420 168" fill="none" role="img" aria-label="Gesture — JavaScript">
<title>Gesture — JavaScript</title>
<desc>Your hands drive macOS. MediaPipe watches, Node decides, Swift presses the keys.</desc>
<style>
  
    text{dominant-baseline:auto}
    @media (prefers-reduced-motion:reduce){
      *{animation:none!important;opacity:1!important;transform:none!important}
      
    }
  
  .bar{transform-origin:0 168px;animation:bar 6s cubic-bezier(.22,1,.36,1) infinite backwards;animation-delay:0.12s}
  @keyframes bar{
    0%,4%{transform:scaleY(0)}
    16%,88%{transform:scaleY(1)}
    97%,100%{transform:scaleY(0)}
  }

  .frame{animation:fr 6s cubic-bezier(.22,1,.36,1) infinite backwards;animation-delay:0.12s}
  @keyframes fr{0%,2%{opacity:0}14%,90%{opacity:1}98%,100%{opacity:0}}

  .cl{animation:cl 6s cubic-bezier(.22,1,.36,1) infinite backwards;animation-delay:calc(0.12s + var(--i)*22ms)}
  @keyframes cl{
    0%,4.667%{opacity:0;transform:translateY(14px)}
    14.167%,86.667%{opacity:1;transform:translateY(0)}
    95.833%,100%{opacity:0}
  }

  .cb{animation:cb 6s cubic-bezier(.22,1,.36,1) infinite backwards;animation-delay:calc(0.12s + var(--i)*80ms)}
  @keyframes cb{
    0%,11.667%{opacity:0;transform:translateY(7px)}
    20.000%,86.667%{opacity:1;transform:translateY(0)}
    95.833%,100%{opacity:0}
  }

  .cc{animation:cc 6s cubic-bezier(.22,1,.36,1) infinite backwards;animation-delay:calc(0.12s + var(--i)*70ms)}
  @keyframes cc{
    0%,18.333%{opacity:0;transform:translateY(6px)}
    26.667%,86.667%{opacity:1;transform:translateY(0)}
    95.833%,100%{opacity:0}
  }

  /* The bar keeps a slow breath through the hold so the grid never dies. */
  .glow{transform-box:fill-box;transform-origin:center;animation:glow 3.2s cubic-bezier(.4,0,.2,1) infinite backwards}
  @keyframes glow{0%,100%{opacity:.95}50%{opacity:.45}}

  .dot{transform-box:fill-box;transform-origin:center;animation:dot 3.2s cubic-bezier(.4,0,.2,1) infinite backwards}
  @keyframes dot{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.76);opacity:.55}}
  </style>
